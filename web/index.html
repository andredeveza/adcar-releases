<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13"><title>AD Car Aura 2.8.1 · Arquivo único</title>
<style>.mini-map-tiles,.mini-map-objects,.mini-map-labels{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.mini-map-tiles{background-color:#0e1b27;background-image:linear-gradient(0deg,transparent 95%,rgba(255,255,255,.06) 100%),linear-gradient(90deg,transparent 95%,rgba(255,255,255,.06) 100%);background-size:64px 64px}
.mini-map-tile{position:absolute;width:256px;height:256px;max-width:none;user-select:none}
.mini-map-objects{z-index:2}
.mini-map-marker{position:absolute;z-index:3;pointer-events:none}
.mini-map-circle{border-radius:50%;transform:translate(-50%,-50%)}
.mini-map-vector{position:absolute;top:0;left:0;overflow:hidden}
.mini-map-labels{z-index:5}
.mini-map-mark{position:absolute;bottom:10px;left:10px;color:#a1abb8;font-size:10px;background:rgba(0,0,0,.5);padding:3px 6px;border-radius:5px}
.mini-map-credit{position:absolute;bottom:10px;right:10px;color:#a1abb8;font-size:10px;background:rgba(0,0,0,.5);padding:3px 6px;border-radius:5px}

/* AD Car Aura 2.8 · "Aura In-Cabin OS" colors (Stitch) at car scale:
   Android Auto / CarPlay sizing — touch targets >= 76 px, primary icons 44 px, secondary 36 px,
   left app rail like AA "Coolwalk"/CarPlay Dashboard, map-first split screens, no custom header (Android status bar stays).
   Old Android WebView safe: no flex gap, no inset, no :has, no min()/max()/clamp(). */
:root{
 --bg:#0b0e13;--c-low:#14171c;--c:#1b1e23;--c-high:#262a30;--c-highest:#31353b;--c-bright:#3a3e45;
 --on:#eef0f4;--on-var:#b4bfc3;--outline:#7f8b8e;
 --accent:#00e5ff;--on-accent:#00363d;--accent-soft:rgba(0,229,255,.16);
 --amber:#fa9b00;--amber-soft:#ffc07a;--green:#52ec6f;--error-c:#93000a;
 --rim:rgba(255,255,255,.07);--t:76px;--rail:96px;--gap:12px;--r:22px;--safe-top:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--on);font-family:Roboto,"Segoe UI",Arial,system-ui,sans-serif;font-weight:600;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{background:var(--c-high);border:2px solid transparent;border-radius:16px;padding:0 1.1rem;height:var(--t);font-size:1.25rem;min-width:0;outline:none;-webkit-user-select:text;user-select:text}
input:focus,select:focus{border-color:var(--accent)}
.num{font-family:Roboto,Arial,sans-serif;font-weight:700;letter-spacing:-.02em}
.lbl{font-size:1rem;font-weight:700;letter-spacing:.04em;color:var(--on-var)}
.muted{color:var(--on-var)}
.small{font-size:1.05rem}
svg.i{width:var(--ico,36px);height:var(--ico,36px);flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.f{fill:currentColor;stroke:none}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center}
.row>*+*{margin-left:12px}

/* Shell: rail + content. The Android status bar above is never covered. */
#app{position:absolute;left:0;right:0;bottom:0;top:var(--safe-top);display:flex}
#rail{width:var(--rail);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0;background:#06080b}
#rail .apps{display:flex;flex-direction:column;align-items:center}
.rb{width:var(--t);height:var(--t);border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--on-var);margin:3px 0}
.rb svg.i{width:var(--ico,40px);height:var(--ico,40px)}
.rb.on{background:var(--accent);color:var(--on-accent)}
.rb:active{background:var(--c-bright)}
.rail-status{display:flex;flex-direction:column;align-items:center}
.sdot{width:12px;height:12px;border-radius:50%;background:var(--outline);margin:5px 0}
.sdot.ok{background:var(--green)}.sdot.warn{background:var(--amber)}
#view{flex:1;min-width:0;position:relative;padding:var(--gap)}
body.full #rail{display:none}
#exitFull{display:none;position:absolute;right:16px;top:16px;z-index:900;height:var(--t);padding:0 24px;border-radius:24px;background:rgba(11,14,19,.94);border:1px solid rgba(255,255,255,.14);align-items:center;font-weight:700;font-size:1.2rem}
#exitFull svg{margin-right:10px}
body.full #exitFull{display:flex}
#toast{position:absolute;left:50%;bottom:24px;-webkit-transform:translateX(-50%);transform:translateX(-50%);max-width:80%;background:#2a2f38;border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 32px rgba(0,0,0,.55);padding:18px 26px;border-radius:20px;font-size:1.2rem;display:none;z-index:1000}
.demo-flag{position:absolute;left:50%;top:6px;-webkit-transform:translateX(-50%);transform:translateX(-50%);z-index:950;background:#3a2a00;color:#ffd08a;font-size:.85rem;font-weight:700;letter-spacing:.06em;padding:4px 14px;border-radius:12px;pointer-events:none}

/* Buttons */
.btn{height:var(--t);min-width:var(--t);padding:0 24px;border-radius:22px;background:var(--c-high);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;white-space:nowrap}
.btn svg{margin-right:10px}
.btn.icon{padding:0;width:var(--t)}.btn.icon svg{margin:0}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--error-c);color:#ffdad6}
.btn:active{-webkit-filter:brightness(1.3);filter:brightness(1.3)}
.btn[disabled]{opacity:.35}

/* Cards: one job, few big things */
.card{background:var(--c);border-radius:var(--r);padding:20px;position:relative;overflow:hidden;min-width:0;min-height:0}
.card-h{display:flex;align-items:center;min-height:44px;margin-bottom:6px}
.card-h .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-h .open{width:var(--t);height:56px;margin:-10px -10px -10px 0;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--on-var)}
.card-h .open svg{width:32px;height:32px}
.tag{font-size:.95rem;font-weight:700;padding:6px 14px;border-radius:14px;background:var(--c-high);color:var(--on-var);white-space:nowrap}
.tag.ok{color:var(--green)}.tag.warn{color:var(--amber-soft)}.tag.acc{color:var(--accent)}

/* Home: map-first splits */
.home{height:100%;display:grid;grid-gap:var(--gap)}
.home.lm2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.home.lm2>:first-child{grid-row:1 / span 2}
.home.l2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.home.l3{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.home.l4{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}

/* Speed */
.speed{display:flex;flex-direction:column}
.speed .big{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
.speed .big .num{font-size:5.5rem;line-height:.95}
.speed .big .u{font-size:1.1rem;font-weight:700;letter-spacing:.14em;color:var(--accent);margin-top:4px}
.pair{display:flex}
.pair>div{flex:1;min-width:0;background:var(--c-low);border-radius:16px;padding:10px 14px}
.pair>div+div{margin-left:10px}
.pair .num{font-size:1.9rem;line-height:1.1}
.pair small{font-size:1rem;color:var(--on-var);margin-left:4px;font-weight:600}
.pair .lbl{display:block;font-size:.9rem}

/* Media card */
.media{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;min-height:0;flex:1}
.art{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#123c45,#25183a);flex:none}
.art img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:none}
.art .ph{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55)}
.art .ph svg{width:44px;height:44px}
.mrow .art{width:96px;height:96px;margin-right:16px}
.media .t{font-family:Roboto,Arial,sans-serif;font-weight:700;font-size:1.6rem;line-height:1.2}
.media .a{font-size:1.15rem;color:var(--on-var);margin-top:2px}
.prog{height:6px;border-radius:3px;background:var(--c-highest);overflow:hidden;margin-top:12px}
.prog b{display:block;height:100%;width:0;background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:space-around;margin-top:10px}
.play{width:88px;height:88px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.play svg.i{width:44px;height:44px}
.media.tall .mrow{flex-direction:column;align-items:stretch;justify-content:flex-start}
.media.tall .mrow .art{width:100%;height:auto;flex:1;min-height:96px;max-height:260px;margin:0 0 14px}

/* Generic big-value cards */
.vals{display:flex;flex:1;align-items:center}
.vals>div{flex:1;min-width:0}
.vals .num{font-size:3rem;line-height:1}
.vals small{font-size:1.1rem;color:var(--on-var);margin-left:4px}
.vals .lbl{display:block;margin-bottom:6px}
.col{display:flex;flex-direction:column}
.src{font-size:.95rem;color:var(--outline);margin-top:8px}
.shortcuts{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;flex:1}
.shortcuts .btn{height:auto;min-height:var(--t);flex-direction:column;font-size:1.05rem;padding:8px}
.shortcuts .btn svg{margin:0 0 6px}

/* Map */
.mapcard{padding:0}
.leaf{position:absolute;left:0;top:0;right:0;bottom:0;background:#0d1a20}
.leaflet-container{background:#0d1a20;font:inherit}
.dark-tiles .leaflet-tile-pane{-webkit-filter:invert(1) hue-rotate(185deg) brightness(.82) contrast(.92) saturate(.55);filter:invert(1) hue-rotate(185deg) brightness(.82) contrast(.92) saturate(.55)}
.leaflet-control-attribution{background:rgba(11,14,19,.7)!important;color:#8e95a5!important;font-size:10px!important}
.leaflet-control-attribution a{color:#8e95a5!important}
.ov{position:absolute;z-index:500}
.ov-tl{left:14px;top:14px;right:calc(var(--t) + 28px)}
.ov-r{right:14px;top:14px;display:flex;flex-direction:column}
.ov-r .btn{margin-bottom:10px;background:rgba(27,30,35,.95);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.ov-r .btn.pri{background:var(--accent)}
.ov-b{left:14px;right:calc(var(--t) + 28px);bottom:14px}
.glass{background:rgba(20,23,28,.96);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.turn{display:flex;align-items:center;padding:12px 16px;max-width:30rem}
.turn .ic{width:72px;height:72px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none;margin-right:16px}
.turn .ic svg{width:48px;height:48px}
.turn .num{font-size:2.3rem;line-height:1}
.turn small{display:block;font-size:1.15rem;color:var(--on-var);margin-top:4px}
.searchbar{display:flex;align-items:center;height:var(--t);padding:0 8px 0 18px;max-width:34rem}
.searchbar svg{color:var(--accent)}
.searchbar input{flex:1;background:none;border:0;height:100%;font-size:1.3rem;margin:0 10px;padding:0}
.searchbar .btn{height:60px;min-width:60px;border-radius:18px}
.pill{display:inline-flex;align-items:center;height:var(--t);padding:0 26px 0 20px;font-size:1.25rem;font-weight:700}
.pill svg{color:var(--accent);margin-right:12px}
.results{margin-top:10px;max-height:60vh;overflow:auto;max-width:34rem}
.results button{display:block;width:100%;text-align:left;padding:14px 20px;min-height:var(--t);border-bottom:1px solid var(--rim);font-size:1.05rem;color:var(--on-var)}
.results button b{display:block;font-size:1.3rem;color:var(--on)}
.eta{display:flex;align-items:center;padding:10px 12px 10px 22px;min-height:calc(var(--t) + 16px)}
.eta .cell{margin-right:28px}
.eta .num{font-size:2rem;line-height:1.05}
.eta .lbl{font-size:.85rem}
.mapempty{position:absolute;left:50%;bottom:45%;-webkit-transform:translateX(-50%);transform:translateX(-50%);z-index:400;background:rgba(16,20,24,.92);border-radius:18px;padding:12px 22px;font-size:1.15rem;color:var(--on-var);white-space:nowrap}
.me{width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #001f24;box-shadow:0 0 0 8px rgba(0,229,255,.25)}
.mappage{height:100%;position:relative;border-radius:var(--r);overflow:hidden}
.mapcard.compact .ov-r .btn:nth-child(n+3){display:none}
.mapcard.compact .turn .ic{width:56px;height:56px}.mapcard.compact .turn .num{font-size:1.8rem}

/* Drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:30rem;max-width:92%;z-index:700;background:var(--c-low);box-shadow:-12px 0 32px rgba(0,0,0,.55);padding:18px;overflow:auto;display:none}
.drawer.open{display:block}
.drawer h3{font-family:Roboto,Arial,sans-serif;margin:0 0 14px;font-size:1.6rem;display:flex;align-items:center}
.drawer h3 span{flex:1}
.drawer .sec{margin-bottom:18px}
.drawer .btn{width:100%;margin-bottom:10px;justify-content:flex-start}
details{background:var(--c);border-radius:18px;padding:0 18px;margin-bottom:10px}
summary{min-height:var(--t);display:flex;align-items:center;font-weight:700;font-size:1.15rem;cursor:pointer;outline:none}
details p{font-size:1.1rem;color:var(--on-var);line-height:1.5;margin:0 0 16px}

/* Media page */
.player{height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-column-gap:28px;grid-row-gap:16px;padding:24px;background:radial-gradient(120% 90% at 15% 30%,rgba(0,229,255,.12),transparent 60%),var(--c)}
.player .art{width:46vh;height:46vh;align-self:center}
.player .art .ph svg{width:30%;height:30%}
.player .info{display:flex;flex-direction:column;justify-content:center;min-width:0}
.player .t{font-family:Roboto,Arial,sans-serif;font-weight:700;font-size:2.4rem;line-height:1.15}
.player .a{font-size:1.4rem;color:var(--on-var);margin-top:6px}
.times{display:flex;justify-content:space-between;font-size:1rem;color:var(--on-var);margin-top:6px}
.player .ctrls{justify-content:flex-start;margin-top:18px}
.player .ctrls .btn{width:88px;height:88px;border-radius:26px;margin-right:18px}
.player .ctrls .btn svg.i{width:44px;height:44px}
.player .play{width:104px;height:104px;margin-right:18px}
.player .play svg.i{width:52px;height:52px}
.srcrow{grid-column:1 / span 2;display:flex;overflow-x:auto}
.srcrow .btn{margin-right:10px;flex:none}
.ptools{position:absolute;right:24px;top:24px;display:flex}
.ptools .btn{margin-left:10px}

/* Vehicle */
.obd{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-gap:var(--gap)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));grid-gap:var(--gap);min-height:0}
.metric{background:var(--c);border-radius:var(--r);padding:16px 20px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.metric .num{font-size:3.6rem;line-height:1}
.metric .num small{font-family:Manrope;font-size:1.2rem;font-weight:600;color:var(--on-var);margin-left:6px;letter-spacing:0}
.meter{height:8px;border-radius:4px;background:var(--c-low);overflow:hidden}
.meter b{display:block;height:100%;width:0;background:var(--accent)}
.status{display:flex;align-items:center;background:var(--c);border-radius:var(--r);padding:8px 8px 8px 22px}
.status .btn+.btn{margin-left:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--outline);margin-right:16px;flex:none}
.dot.ok{background:var(--green)}.dot.warn{background:var(--amber)}.dot.err{background:#ff6b6b}
.status b{font-size:1.3rem}
.devs .btn{width:100%;justify-content:flex-start;margin-bottom:10px;background:var(--c)}

/* Settings (used parked; still car-sized) */
.settings{height:100%;display:grid;grid-template-columns:17rem minmax(0,1fr);grid-gap:var(--gap)}
.tabs{background:var(--c);border-radius:var(--r);padding:10px;overflow:auto}
.tabs .btn{width:100%;justify-content:flex-start;background:none;color:var(--on-var);margin-bottom:4px;font-size:1.15rem;padding:0 18px}
.tabs .btn.on{background:var(--accent);color:var(--on-accent)}
.pane{overflow:auto;min-height:0}
.pane .card{margin-bottom:var(--gap)}
.pane h2{font-family:Roboto,Arial,sans-serif;font-size:1.8rem;margin:0 0 6px}
.pane p.d{font-size:1.1rem;color:var(--on-var);margin:0 0 16px;line-height:1.45}
.pane .sub{font-size:1rem;font-weight:700;color:var(--on-var);margin:20px 0 10px;letter-spacing:.04em}
.lay{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:12px}
.lay button{background:var(--c-high);border-radius:20px;padding:14px;text-align:left;font-weight:700;font-size:1.1rem;min-height:8rem;border:3px solid transparent}
.lay button.on{border-color:var(--accent);background:var(--accent-soft)}
.thumb{height:3.6rem;display:grid;grid-gap:4px;margin-bottom:10px}
.thumb i{background:var(--c-bright);border-radius:6px;display:block}
.lay button.on .thumb i{background:var(--accent)}
.slot{display:flex;align-items:center;background:var(--c-high);border-radius:20px;padding:8px 8px 8px 20px;margin-bottom:10px}
.slot .k{font-family:Roboto,Arial,sans-serif;font-weight:700;font-size:1.3rem;color:var(--accent);width:3rem;flex:none}
.slot select{flex:1;margin-right:8px;background:var(--c-highest)}
.slot .btn{margin-left:8px;background:var(--c-highest)}
.seg{display:flex;background:var(--c-high);border-radius:22px;padding:6px}
.seg button{flex:1;height:64px;border-radius:18px;font-weight:700;font-size:1.15rem;color:var(--on-var)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.slider{margin:4px 0 14px}
.slider .row{justify-content:space-between;font-size:1.15rem}
.slider .row b{color:var(--accent);font-family:'Space Grotesk'}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:var(--t);background:none;border:0;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:var(--c-highest)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:var(--accent);margin-top:-17px;border:5px solid var(--on-accent)}
.swatches{display:flex;flex-wrap:wrap}
.swatches button{width:64px;height:64px;border-radius:50%;margin:0 12px 12px 0;border:4px solid transparent}
.swatches button.on{border-color:#fff}
.kv{display:flex;justify-content:space-between;align-items:center;min-height:64px;border-bottom:1px solid var(--rim);font-size:1.15rem}
.kv:last-child{border-bottom:0}
.kv b{text-align:right}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));grid-gap:10px;margin-top:14px}
.brands button{background:var(--c-high);border-radius:20px;min-height:8rem;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1rem;font-weight:700;border:3px solid transparent}
.brands button.on{border-color:var(--accent);background:var(--accent-soft)}
.brands img{height:3rem;max-width:6rem;object-fit:contain;margin-bottom:8px}
.logo-fb{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--c-bright);display:flex;align-items:center;justify-content:center;font-family:Roboto,Arial,sans-serif;margin-bottom:8px}
.hero{display:flex;align-items:center;background:radial-gradient(90% 120% at 20% 0,var(--accent-soft),transparent 70%),var(--c-high);border-radius:20px;padding:18px}
.hero img{height:4rem;max-width:8rem;object-fit:contain;margin-right:18px}
.hero .num{font-size:2rem}
.ota-bar{height:10px;border-radius:5px;background:var(--c-highest);overflow:hidden;margin:16px 0 10px}
.ota-bar b{display:block;height:100%;width:0;background:var(--accent)}
.note{font-size:1rem;color:var(--outline);line-height:1.45;margin-top:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-gap:var(--gap)}
.check{display:flex;align-items:center;min-height:var(--t);font-size:1.1rem}
.check input{width:36px;height:36px;margin-right:14px}

  var w=window.innerWidth,h=window.innerHeight-top-bottom;

  var t={compacto:68,conforto:76,extra:88}[opts.aaPreset]||76;

  d.style.fontSize=(16*scale).toFixed(2)+'px';

function geomSteps(coords,cum){
  var out=[],last=-1;
  for(var i=1;i<coords.length-1;i++){
    var a=i,b=i;while(a>0&&cum[i]-cum[a]<25)a--;while(b<coords.length-1&&cum[b]-cum[i]<25)b++;
    if(a===i||b===i)continue;
    var d=bearing(coords[i],coords[b])-bearing(coords[a],coords[i]);if(d>180)d-=360;if(d<-180)d+=360;
    if(Math.abs(d)>35&&(last<0||cum[i]-cum[last]>60)){out.push({idx:i,icon:turnIcon(d),text:turnText(d,'')});last=i;}
  }
  return out;
}
function setRoute(coords,dest,source,dist,time,steps){
  var cum=[0];for(var i=1;i<coords.length;i++)cum.push(cum[i-1]+hav(coords[i-1][0],coords[i-1][1],coords[i][0],coords[i][1]));
  var total=dist||cum[cum.length-1],est=!time;
  route={coords:coords,cum:cum,dest:dest,source:source,dist:total,time:time||total/(40/3.6),timeEst:est,steps:steps||geomSteps(coords,cum)};
  follow=has(st.lat);drawRoute();refreshMapOverlays();
}
function refreshMapOverlays(){var tl=$('tl');if(tl){if(route){var t=$('turnBox');if(t)t.innerHTML=turnHTML();else tl.innerHTML='<div id="turnBox">'+turnHTML()+'</div>';}else if(!$('q'))tl.innerHTML=topLeft(opts.screen==='map');}var e=$('etaBox');if(e)e.innerHTML=etaHTML(opts.screen==='map');}
var pendingDest=null;
function routeTo(dest){
  if(!has(st.lat)){toast('Aguardando GPS: autorize a localização para calcular a rota');return;}
  pendingDest=dest;toast('Calculando rota para '+dest.name+'…');
  if(N&&app.brouter){call('routeTo',dest.lat+','+dest.lon);return;}
  osrm(dest);
}
function osrm(dest){
  var u='https://router.project-osrm.org/route/v1/driving/'+st.lon+','+st.lat+';'+dest.lon+','+dest.lat+'?overview=full&geometries=geojson&steps=true';
  get(u,function(r){
    if(!r||!r.routes||!r.routes.length){toast('Rota indisponível (sem internet e sem BRouter)');return;}
    var R=r.routes[0],coords=R.geometry.coordinates.map(function(c){return [c[1],c[0]];});
    var steps=[];var cum=[0];for(var i=1;i<coords.length;i++)cum.push(cum[i-1]+hav(coords[i-1][0],coords[i-1][1],coords[i][0],coords[i][1]));
    (R.legs[0].steps||[]).forEach(function(s){var m=s.maneuver||{};if(m.type==='depart')return;var loc=m.location,best=0,bd=1e12;
      for(var j=0;j<coords.length;j++){var d=Math.abs(coords[j][0]-loc[1])+Math.abs(coords[j][1]-loc[0]);if(d<bd){bd=d;best=j;}}
      var mod=m.modifier||'straight',icon=mod.indexOf('uturn')>=0?'uturn':mod.indexOf('sharp right')>=0||mod==='right'?'right':mod.indexOf('sharp left')>=0||mod==='left'?'left':mod==='slight right'?'sright':mod==='slight left'?'sleft':m.type==='arrive'?'flag':'straight';
      var verb=m.type==='arrive'?'Chegada':m.type==='roundabout'||m.type==='rotary'?'Na rotatória, saída '+(m.exit||''):icon==='right'?'Vire à direita':icon==='left'?'Vire à esquerda':icon==='sright'?'Mantenha-se à direita':icon==='sleft'?'Mantenha-se à esquerda':icon==='uturn'?'Faça o retorno':'Siga em frente';
      steps.push({idx:best,icon:icon,text:verb+(s.name&&m.type!=='arrive'?' na '+s.name:'')});});
    setRoute(coords,dest,'Rota online (OSRM)',R.distance,R.duration,steps);
  },function(){toast('Sem internet para rota online. Instale o BRouter para rotas offline.');});
}
function get(url,ok,fail){var x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=12000;x.onload=function(){if(x.status===200){var j=json(x.responseText,null);if(j!=null){ok(j);return;}}if(fail)fail();};x.onerror=x.ontimeout=function(){if(fail)fail();};x.send();}
function doSearch(){
  var q=($('q')||{}).value||'';q=q.trim();if(!q)return;
  var m=q.replace(/\s/g,'').match(/^(-?\d{1,2}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)$/);
  if(m){routeTo({name:q,lat:+m[1],lon:+m[2]});return;}
  var box=$('results');box.style.display='block';box.innerHTML='<button type="button">Buscando…</button>';
  var near=has(st.lat)?'&viewbox='+(st.lon-1)+','+(st.lat+1)+','+(st.lon+1)+','+(st.lat-1):'';
  get('https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=br&accept-language=pt-BR'+near+'&q='+encodeURIComponent(q),function(list){
    lastResults=list||[];
    box.innerHTML=lastResults.length?lastResults.map(function(r,i){var p=r.display_name.split(',');return '<button type="button" onclick="Aura.pick('+i+')"><b>'+esc(p[0])+'</b>'+esc(p.slice(1,4).join(','))+'</button>';}).join(''):'<button type="button">Nada encontrado</button>';
  },function(){box.innerHTML='<button type="button">Busca de endereço precisa de internet. Offline: digite lat,lon.</button>';});
}

  return '<section class="card"><div class="row"><div class="badge" style="width:3.4rem;height:3.4rem;border-radius:1rem;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center">'+I('down')+'</div>'+
   '<div class="grow"><h2 style="margin:0">'+esc(title)+'</h2><div class="small muted">Instalada: '+esc(app.versionName)+(app.versionCode?' (vc '+app.versionCode+')':'')+'</div></div>'+
   (upd.url&&st_!=='downloading'?B('down',st_==='downloaded'||st_==='permission'?'Instalar APK':'Baixar e instalar',st_==='downloaded'||st_==='permission'?'Aura.install()':'Aura.download()','pri'):B('search','Verificar agora','Aura.check()','pri',st_==='checking'||st_==='downloading'?' disabled':''))+'</div>'+
   '<div class="ota-bar"><b style="width:'+Math.max(0,Math.min(100,upd.percent))+'%"></b></div><div class="small muted">'+esc(upd.message)+'</div>'+
   (upd.notes?'<div class="card" style="background:var(--c-high);margin-top:.8rem"><div class="lbl">O que mudou</div><div class="small" style="white-space:pre-line;line-height:1.5;margin-top:.4rem">'+esc(upd.notes)+'</div></div>':'')+
   '<p class="note">Fonte oficial: github.com/andredeveza/adcar-releases. O APK é conferido (SHA-256, pacote e versão maior) antes de abrir o instalador do Android. A atualização mantém dados e configurações.</p></section>'+
   '<section class="card"><div class="lbl">Componentes</div><div class="kv"><span>AD Car Ponte (celular)</span><b>'+(st.obdSource==='ponte'&&st.obd?'Conectada':'Instalar no celular · 1.0.0')+'</b></div><div class="kv"><span>BRouter</span><b>'+(app.brouter?'Conectado':'Não detectado')+'</b></div><div class="kv"><span>Mapa offline</span><b>'+(st.mapReady?'Importado':'Não importado')+'</b></div>'+
   '<p class="note">A central procura atualização sozinha 20 s depois de ligar e só avisa; a instalação sempre pede sua confirmação.</p></section>';
}
function paneAbout(){var d=json(call('getDeviceProfile'),{});
  return '<section class="card"><h2>AD Car Aura '+esc(app.versionName)+'</h2><p class="d">Launcher para central Android. Não substitui câmera de ré, rádio original, comandos de volante, CAN-box/MCU nem firmware.</p>'+
   '<div class="kv"><span>Central</span><b>'+esc((d.headUnitManufacturer||'')+' '+(d.headUnitModel||''))+'</b></div><div class="kv"><span>Android</span><b>'+esc(d.androidVersion||'—')+'</b></div>'+
   '<div class="kv"><span>Tela</span><b>'+(d.screenPxWidth?d.screenPxWidth+'×'+d.screenPxHeight+' px':'—')+' · janela '+window.innerWidth+'×'+window.innerHeight+'</b></div><div class="kv"><span>Interface</span><b>'+VERSION_UI+' · Aura In-Cabin OS</b></div>'+
   '<div class="row" style="margin-top:.8rem">'+B('gear','Configurações do Android',"Aura.launch('settings')")+'</div></section>';}

/* ---------- render ---------- */
function render(){
  if(map){try{map.remove();}catch(e){}map=null;mapLayers={};}
  applySizing();renderHead();renderDock();
  var s=opts.screen,v=$('view');
  v.innerHTML=s==='map'?buildMap():s==='media'?buildMedia():s==='vehicle'?buildVehicle():s==='settings'?buildSettings():buildHome();
  $('exitFull').innerHTML=I('exit')+'<span>Sair da tela cheia</span>';
  if(DEMO||!N)v.insertAdjacentHTML('beforeend','<div class="demo-flag">'+(DEMO?'DEMONSTRAÇÃO · dados fictícios':'MODO WEB · GPS real quando autorizado')+' · <a href="'+(DEMO?'#':'#demo')+'" onclick="location.hash=this.getAttribute(\'data-hash\');location.reload();return false" data-hash="'+(DEMO?'':'demo')+'">'+(DEMO?'Sair':'Testar demonstração')+'</a></div>');
  fitCards();
  if($('leaf'))mountMap();
  live();paintVol();
  var b2=$('volBar2');if(b2)b2.style.width=(volPct||0)+'%';
}
/* Cards measure their slot and switch to compact layouts instead of overflowing. */
function fitCards(){
  var c=document.querySelectorAll('#view .home>.card');
  for(var i=0;i<c.length;i++){var el=c[i],h=el.offsetHeight,base=el.className.replace(/\s*(short|tall|compact)\b/g,'');
    var cls=/mapcard/.test(base)?(h<380?' compact':''):(h<250?' short':'')+(/media/.test(base)&&h>430&&el.offsetWidth<560?' tall':'');
    el.className=base+cls;}
}
/* Update values in place (keeps the map and inputs intact). */
function setK(k,txt){var l=document.querySelectorAll('[data-k="'+k+'"]');for(var i=0;i<l.length;i++)if(l[i].textContent!==txt)l[i].textContent=txt;}
function live(){
  var v=speedVal();setK('speed',has(v)?String(Math.round(v)):'—');setK('spdsrc',spdTag());
  var a=document.querySelectorAll('[data-k="arc"]');for(var i=0;i<a.length;i++){a[i].setAttribute('stroke-dasharray',arc((v||0)/180));a[i].style.opacity=has(v)&&v>=1?1:0;}
  for(i=0;i<MOTOR.length;i++){setK(MOTOR[i][1],val(MOTOR[i][1],MOTOR[i][3]));var mm=document.querySelectorAll('[data-m="'+MOTOR[i][1]+'"]');for(var j=0;j<mm.length;j++){var x=st[MOTOR[i][1]];mm[j].style.width=(st.obd||DEMO)&&has(x)?Math.max(0,Math.min(100,100*x/Number(mm[j].getAttribute('data-max'))))+'%':'0';}}
  setK('tripkm',fmtNum(trip.km,1));setK('tripmin',fmtDur((Date.now()-trip.start)/1000));setK('tripavg',fmtNum(trip.moving>60?trip.km/(trip.moving/3600):null,0));
  setK('obdtag',obdChip());setK('obdsrc',obdLine());
  var dots=document.querySelectorAll('[data-k="obddot"]');for(i=0;i<dots.length;i++)dots[i].className='dot '+(st.obd?'ok':st.obdState==='error'?'err':st.obdState==='idle'?'':'warn');
  liveMedia();
  var dg=$('dotGps');if(dg)dg.className='sdot '+(st.gps?'ok':'warn');var dob=$('dotObd');if(dob)dob.className='sdot '+(st.obd?'ok':st.obdState==='idle'?'':'warn');
  if(weather){setK('wxt',fmtNum(weather.t,0)+'°');setK('wxd',weather.d);}
}
function posNow(){var p=md.positionMs||0;if(md.playing&&md.at)p+=Date.now()-md.at;return md.durationMs?Math.min(p,md.durationMs):p;}
function liveMedia(){
  setK('mtitle',mTitle());setK('martist',mArtist());setK('msrc',srcName());
  var p=posNow(),pct=md.durationMs>0?100*p/md.durationMs:0;
  var bars=document.querySelectorAll('[data-k="mprog"]');for(var i=0;i<bars.length;i++)bars[i].style.width=pct+'%';
  setK('mpos',fmtTime(p));setK('mdur',fmtTime(md.durationMs));
  var pl=document.querySelectorAll('[data-k="mplay"]');for(i=0;i<pl.length;i++){var want=md.playing?'pause':'play';if(pl[i].getAttribute('data-s')!==want){pl[i].setAttribute('data-s',want);pl[i].innerHTML=I(want);}}
  var imgs=document.querySelectorAll('[data-k="mart"]');
  for(i=0;i<imgs.length;i++){var im=imgs[i],ok=typeof md.cover==='string'&&(/^(data:image\/(png|jpeg|webp);base64,|https:\/\/)/i).test(md.cover);
    if(ok){if(im.getAttribute('src')!==md.cover)im.src=md.cover;im.style.display='block';}else{im.removeAttribute('src');im.style.display='none';}}
}

/* ---------- native callbacks ---------- */
window.ADCar={
  receiveState:function(raw){var o=json(raw,null);if(!o)return;var wasObd=st.obd,hadFix=has(st.lat);
    for(var k in st)if(o.hasOwnProperty(k))st[k]=o[k];
    trackTrip();live();if(map){drawMe();if(route)refreshMapOverlays();}
    if(!hadFix&&has(st.lat))loadWeather();
    if(wasObd!==st.obd&&opts.screen==='vehicle'){var d=$('devs');if(d)d.innerHTML=devList();}},
  receiveMedia:function(raw){var o=json(raw,null);if(!o)return;md.available=!!o.available;md.permission=o.permission!==false;
    md.title=o.title||'';md.artist=o.artist||'';md.album=o.album||'';md.source=o.source||'';md.cover=o.cover||'';md.playing=!!o.playing;
    md.durationMs=Number(o.durationMs)||0;md.positionMs=Number(o.positionMs)||0;md.at=Date.now();liveMedia();},
  receiveUpdate:function(raw){var u=json(raw,{});upd.checked=true;upd.version=u.version||'';upd.notes=u.notes||'';upd.url=u.url||'';upd.available=!!u.url;
    upd.stage=u.error?'error':u.url?'available':'current';upd.message=u.status||'';upd.percent=0;
    if(u.available&&opts.screen!=='settings')toast('Atualização '+upd.version+' disponível · Ajustes › Atualizações');renderHead();if(opts.tab==='updates'&&opts.screen==='settings')rePane();},
  receiveUpdateProgress:function(raw){var p=json(raw,{});upd.stage=p.stage||'error';upd.message=p.message||'';upd.percent=Number(p.percent)||0;if(opts.tab==='updates'&&opts.screen==='settings')rePane();else if(upd.stage==='error')toast(upd.message);},
  routeResult:function(raw){var d=json(raw,{});
    if(d.ok&&d.coords&&d.coords.length>1&&pendingDest){setRoute(d.coords,pendingDest,'BRouter offline',d.distM||null,d.timeS||null,null);toast('Rota offline calculada pelo BRouter');}
    else if(pendingDest){toast('BRouter: '+(d.error||'sem rota')+'. Tentando rota online…');osrm(pendingDest);}},
  onMapImport:function(msg){toast(msg);st.mapReady=true;if(opts.screen==='settings')rePane();}
};
function rePane(){var p=$('pane');if(!p)return;var y=p.scrollTop;p.innerHTML=paneHTML();p.scrollTop=y;}
function trackTrip(){
  if(!st.gps||!has(st.lat))return;var now=Date.now();
  if(trip.last){var d=hav(trip.last.lat,trip.last.lon,st.lat,st.lon),dt=(now-trip.last.t)/1000;
    if(d>8&&d<dt*70&&(st.speed||0)>4){trip.km+=d/1000;trip.moving+=dt;trip.last={lat:st.lat,lon:st.lon,t:now};
      try{localStorage.setItem('auraTrip',JSON.stringify({km:trip.km,start:trip.start,moving:trip.moving}));}catch(e){}}
    else if(d>=8)trip.last={lat:st.lat,lon:st.lon,t:now};}
  else trip.last={lat:st.lat,lon:st.lon,t:now};
}
var WMO={0:'Céu limpo',1:'Poucas nuvens',2:'Parcialmente nublado',3:'Nublado',45:'Neblina',48:'Neblina',51:'Garoa',53:'Garoa',55:'Garoa',61:'Chuva fraca',63:'Chuva',65:'Chuva forte',80:'Pancadas',81:'Pancadas',82:'Pancadas fortes',95:'Trovoadas',96:'Trovoadas',99:'Trovoadas'};
function loadWeather(){if(!has(st.lat)||Date.now()-weatherAt<900000)return;weatherAt=Date.now();
  get('https://api.open-meteo.com/v1/forecast?latitude='+st.lat.toFixed(3)+'&longitude='+st.lon.toFixed(3)+'&current=temperature_2m,weather_code&timezone=auto',function(r){
    if(r&&r.current){weather={t:r.current.temperature_2m,d:WMO[r.current.weather_code]||'—'};live();}},function(){weatherAt=0;});}

/* ---------- public actions (onclick) ---------- */
window.Aura={
  go:function(s,tab,focus){if(s==='settings'&&tab)opts.tab=tab;opts.screen=s;drawerOpen=false;if(s==='home'||s==='settings')isFull=false;save();render();if(focus){var q=$('q');if(q)setTimeout(function(){q.focus();},50);}},
  tab:function(t){opts.tab=t;save();render();},
  drawer:function(o){drawerOpen=!!o;var d=$('drawer');if(d)d.className='drawer'+(o?' open':'');if(o&&opts.screen==='vehicle'){var l=$('devs');if(l)l.innerHTML=devList();}},
  full:function(o){isFull=!!o;applySizing();render();},
  set:function(k,v){opts[k]=v;save();if(k==='color'&&route)drawRoute();render();},
  slide:function(k,v){opts[k]=Number(v);save();var l=$('sv_'+k);if(l)l.textContent=SLFMT[k](Number(v));applySizing();},
  layout:function(l){opts.layout=l;save();render();},
  slot:function(i,w){var j=opts.screens.indexOf(w);if(j>=0&&j!==i)opts.screens[j]=opts.screens[i];opts.screens[i]=w;save();render();},
  move:function(i,d){var j=i+d;if(j<0||j>=slotsFor(opts.layout))return;var t=opts.screens[i];opts.screens[i]=opts.screens[j];opts.screens[j]=t;save();render();},
  resetLayout:function(){opts.layout='m2';opts.screens=['mapa','midia','velocimetro','motor'];opts.uiScale=1;opts.spacing=12;opts.aaPreset='conforto';opts.color='#00e5ff';save();render();toast('Layout padrão restaurado');},
  key:function(c){if(!N){toast('Prévia: no APK controla o player do Android');return;}call('mediaKey',c);if(c===85){md.playing=!md.playing;md.positionMs=posNow();md.at=Date.now();liveMedia();}setTimeout(pollMedia,700);},
  launch:function(k){if(!N){toast('Prévia: no APK abre '+k);return;}call('launchApp',k);},
  vol:function(d){if(!N){toast('Prévia: volume no APK');return;}call('changeVolume',d);setTimeout(function(){readVol();var b2=$('volBar2');if(b2)b2.style.width=(volPct||0)+'%';},250);},
  zoom:function(d){if(map)map.setZoom(map.getZoom()+d);},
  recenter:function(){follow=true;var r=$('recBtn');if(r)r.className='btn icon pri';if(map&&has(st.lat))map.setView([st.lat,st.lon],16);else toast('Sem posição do GPS ainda');},
  search:doSearch,
  pick:function(i){var r=lastResults[i];if(!r)return;$('results').style.display='none';routeTo({name:r.display_name.split(',')[0],lat:+r.lat,lon:+r.lon});},
  clearRoute:function(){route=null;pendingDest=null;drawRoute();refreshMapOverlays();},
  setHome:function(){if(!has(st.lat)){toast('Sem posição do GPS');return;}opts.home={lat:st.lat,lon:st.lon};save();toast('Casa salva');render();},
  goHome:function(){if(opts.home)routeTo({name:'Casa',lat:opts.home.lat,lon:opts.home.lon});},
  radio:function(){if(!N){toast('Prévia: no APK abre o rádio da central');return;}var r=json(call('openRadio',fm.selected||''),{});if(!r.ok){toast(r.message||'Rádio não encontrado');Aura.fmScan();}},
  fmScan:function(){if(!N){fm.message='Detecção disponível no APK.';}else{var r=json(call('getRadioApps'),{});fm.apps=r.apps||[];fm.selected=r.selected||fm.selected;fm.message=r.message||'';}
    var a=$('fmInfo');if(a)a.textContent=fm.message;var l=$('fmList');if(l)l.innerHTML=fmList();},
  fmPick:function(p){var r=json(call('chooseRadio',p),{});if(r.ok){fm.selected=r.package;fm.message='Rádio escolhido: '+r.label;}else fm.message=r.message||'Indisponível';Aura.fmScan();},
  mediaAccess:function(){if(N)call('enableMediaAccess');else toast('Prévia: no APK abre a permissão');},
  devs:function(){var l=$('devs');if(l)l.innerHTML=devList();},
  obdConnect:function(a){if(!N)return;call('connectObd',a);toast(a==='ponte'?'Conectando à Ponte pelo Wi-Fi…':'Conectando ao adaptador Bluetooth…');Aura.drawer(false);},
  obdOff:function(){call('disconnectObd');render();},
  ponteHost:function(){var v=($('ponteHost')||{}).value||'';v=v.trim();if(v&&!/^\d{1,3}(\.\d{1,3}){3}$/.test(v)){toast('IP inválido');return;}call('setPonteHost',v);toast(v?'IP da Ponte salvo':'Ponte em modo automático');rePane();},
  make:function(slug){var b=(window.ADCAR_BRANDS||[]).filter(function(x){return x[1]===slug;})[0];if(!b)return;opts.make=b[0];opts.makeSlug=b[1];opts.model='';saveCar();render();},
  car:function(k,v){opts[k]=k==='year'?String(v).replace(/\D/g,'').slice(0,4):String(v).slice(0,50);saveCar();renderHead();},
  brandQ:function(q){brandQ=String(q).slice(0,40);var g=$('brands');if(g)g.innerHTML=brandGrid();},
  allBrands:function(){allBrands=!allBrands;rePane();},
  importMap:function(){if(!N){toast('Importação no APK');return;}call('importMbtiles');},
  check:function(){if(!N){upd.stage='error';upd.message='A consulta funciona no APK instalado.';rePane();return;}upd.stage='checking';upd.message='Consultando o manifesto oficial…';rePane();call('checkUpdates');},
  download:function(){if(!upd.url)return;upd.stage='downloading';upd.message='Preparando download…';upd.percent=0;rePane();call('downloadUpdate',upd.url);},
  install:function(){call('installDownloadedUpdate');},
  resetTrip:function(){trip={km:0,start:Date.now(),last:null,moving:0};try{localStorage.removeItem('auraTrip');}catch(e){}live();}
};
function saveCar(){save();call('saveVehicleProfile',JSON.stringify({make:opts.make,makeSlug:opts.makeSlug,model:opts.model,year:opts.year,logo:brandUrl(opts.makeSlug)}));}
function pollState(){var s=call('getTelemetry');if(s)window.ADCar.receiveState(s);}
function pollMedia(){var m=call('getMediaState');if(m)window.ADCar.receiveMedia(m);}

/* ---------- start ---------- */
if(N){app=json(call('getAppInfo'),app)||app;insets=json(call('getInsets'),null);pollState();pollMedia();readVol();}
render();
/* Browser/PWA mode: real GPS, never fabricated car telemetry. Requires secure context
   (HTTPS, localhost or compatible file:// environments) and user location permission. */
if(!N&&!DEMO&&navigator.geolocation){
  var lastBrowserGps=null;
  try{navigator.geolocation.watchPosition(function(pos){
    var c=pos.coords, sp=has(c.speed)&&c.speed>=0?c.speed*3.6:null;
    /* Derive speed only when credible samples are available, not from a single fix. */
    if(sp===null&&lastBrowserGps){var dt=(pos.timestamp-lastBrowserGps.at)/1000;
      if(dt>1&&dt<45&&has(c.accuracy)&&c.accuracy<45){var dist=hav(lastBrowserGps.lat,lastBrowserGps.lon,c.latitude,c.longitude);if(dist>Math.max(8,c.accuracy)&&dist/dt<55)sp=dist/dt*3.6;}}
    lastBrowserGps={lat:c.latitude,lon:c.longitude,at:pos.timestamp};
    window.ADCar.receiveState(JSON.stringify({gps:true,speed:sp,lat:c.latitude,lon:c.longitude,
      alt:has(c.altitude)?c.altitude:null,bearing:has(c.heading)?c.heading:null}));
    if(!weather)loadWeather();
  },function(err){if(err.code===1)toast('GPS não autorizado. Ative a localização no navegador para ver sua posição.');
       else if(err.code===2)toast('GPS indisponível neste dispositivo.');
  },{enableHighAccuracy:true,maximumAge:3000,timeout:25000});}catch(e){toast('GPS indisponível neste ambiente.');}
}
if(N){setInterval(pollState,2000);setInterval(pollMedia,3000);setInterval(readVol,2500);setInterval(function(){app.brouter=(json(call('getAppInfo'),{})||{}).brouter||false;},15000);}
setInterval(tick,5000);setInterval(function(){if(md.playing)liveMedia();live();},1000);
window.addEventListener('resize',function(){applySizing();fitCards();});
if(DEMO){loadWeather();}
})();
</script>
</body></html>
