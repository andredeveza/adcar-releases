name: Publicar APK Aura 2.2.0
on:
  push:
    paths:
      - '.github/workflows/publish-aura-22.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar APK compilado e assinado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-067c-820e-bffe-3a70bc1a3273/raw?se=2026-10-30T02%3A28%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=43e1604f-6d37-5c28-bb66-10a0757c2be0&skoid=0a91ee30-885e-46c5-aa98-ae8c7359b1d8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T23%3A09%3A38Z&ske=2026-10-30T23%3A09%3A38Z&sks=b&skv=2026-02-06&sig=EYZQv7muNf7kQUAc5uHwuahXDAeGdVdxmkhgiHPzOV4%3D'
        run: |
          curl --fail --location --retry 3 --max-time 110 "$ARTIFACT_URL" -o /tmp/aura-build.zip
          unzip -p /tmp/aura-build.zip app-debug.apk > AD-Car-Aura-2.2.0.apk
          test $(stat -c%s AD-Car-Aura-2.2.0.apk) -gt 100000
          unzip -t AD-Car-Aura-2.2.0.apk | tail -1
      - name: Atualizar canal Aura sem afetar canal da central
        run: |
          python3 - <<'PY'
          import json,hashlib,datetime,pathlib
          p=pathlib.Path('AD-Car-Aura-2.2.0.apk')
          data={
            "versionCode":7,
            "versionName":"2.2.0",
            "packageName":"br.com.adcomintegrada.adcar.aura",
            "apk":p.name,
            "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "sizeBytes":p.stat().st_size,
            "date":"2026-10-29",
            "notes":"AD Car Aura 2.2.0 — escala dos cartões e ícones aplicada ao dashboard; mapa online OSM/MapTiler; importação MBTiles raster; integração com BRouter/ELM327 Bluetooth; cache dos logotipos e atualização pelo próprio aplicativo. Mapas offline e BRouter precisam ser configurados no aparelho."
          }
          pathlib.Path('aura-latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publicar versões no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AD-Car-Aura-2.2.0.apk aura-latest.json
          git diff --staged --quiet || git commit -m "Publish AD Car Aura 2.2.0 APK and separate update manifest"
          git push
