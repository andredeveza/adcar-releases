name: Publish AD Car Aura 2.5.0
on:
  push:
    paths:
      - '.github/workflows/publish-aura-2.5.0.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify compiled Android APK
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-db90-820e-a1f6-97974276e9c1/raw?se=2026-10-30T19%3A14%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=87f440d6-a1dc-5079-a490-50435290a765&skoid=0a91ee30-885e-46c5-aa98-ae8c7359b1d8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T23%3A11%3A14Z&ske=2026-10-30T23%3A11%3A14Z&sks=b&skv=2026-02-06&sig=wHvry6A/Ihcsq4JhD5wxyJASINtZQG3cHz1aajfieow%3D'
        run: |
          curl -fLsS --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip app-debug.apk
          echo 'c98d209301e79f7527b7e1dbbd7709616b8215645a5a93e99b0d95eaf2ab8d8c  app-debug.apk' | sha256sum -c -
          mv app-debug.apk AD-Car-Aura-2.5.0.apk
      - name: Publish latest.json metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          apk=Path('AD-Car-Aura-2.5.0.apk')
          data={
            "versionCode":11,
            "versionName":"2.5.0",
            "packageName":"br.com.adcomintegrada.adcar.aura",
            "apk":apk.name,
            "sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
            "sizeBytes":apk.stat().st_size,
            "date":"2026-10-30",
            "notes":"AD Car Aura 2.5.0: nova interface automotiva responsiva inspirada em princípios de ergonomia de Android Auto e CarPlay. Modo Compacto, Conforto ou Extra Grande; botões 48–62 px, fontes maiores, player e painel reformulados, navegação e editor com rolagem para evitar cortes. Mantém controle da área superior OEM, mídia, GPS, BRouter/OBD2 condicionais à configuração. Instalação confirmada no Android."
          }
          Path('aura-latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name adcar-release-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AD-Car-Aura-2.5.0.apk aura-latest.json
          git diff --staged --quiet || (git commit -m 'Release AD Car Aura 2.5.0 responsive cockpit' && git push)
