name: Publish AD Car Aura 2.6.0 Focus Mode
on:
  push:
    paths:
      - '.github/workflows/publish-aura-2.6.0.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify signed 2.6.0
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-4698-820e-9c5b-9a7fa1b47043/raw?se=2026-10-30T21%3A57%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=098fa0ff-547d-548d-b589-2ea50ca6f080&skoid=0a91ee30-885e-46c5-aa98-ae8c7359b1d8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-30T10%3A52%3A25Z&ske=2026-10-31T10%3A52%3A25Z&sks=b&skv=2026-02-06&sig=XM7vYMUjEwUpvhDvVV4o5WhIXFi0HIcB/t6E6Vm%2BOrI%3D'
        run: |
          curl --fail --location --silent --show-error --retry 3 "$ARTIFACT_URL" --output artifact.zip
          unzip -q artifact.zip app-debug.apk
          echo 'e22b19989565ceeec2ec2cc0acf884041d3282b5f5c6ba83349d7f65b4e51a68  app-debug.apk' | sha256sum --check -
          mv app-debug.apk AD-Car-Aura-2.6.0.apk
      - name: Publish OTA channel
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          f=pathlib.Path("AD-Car-Aura-2.6.0.apk")
          manifest={
            "versionCode":14,"versionName":"2.6.0",
            "packageName":"br.com.adcomintegrada.adcar.aura",
            "apk":f.name,"sha256":hashlib.sha256(f.read_bytes()).hexdigest(),
            "sizeBytes":f.stat().st_size,"date":"2026-10-30",
            "notes":"AD Car Aura 2.6.0: MODO FOCO. Em Mapa, Mídia e OBD2 as explicações deixam de ocupar metade da tela; painéis de configurações passam a ser recolhíveis. Mapa em tela ampla, seis métricas OBD2 ampliadas, reprodutor de mídia expandido, atalhos de Som e Rádio FM, Tela cheia com botão de saída. Preserva os ajustes de compatibilidade da central, as permissões e o atualizador da versão 2.5.2. As integrações externas exigem hardware, aplicativos e mapas configurados."
          }
          pathlib.Path("aura-latest.json").write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          PY
          git config user.name 'adcar-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AD-Car-Aura-2.6.0.apk aura-latest.json
          git diff --staged --quiet || (git commit -m 'Publish AD Car Aura 2.6.0 focus mode' && git push)
