name: Publish AD Car Aura 2.9.2 Offline UX TEST (not OTA)
on:
  push:
    paths: ['.github/workflows/publish-test-aura-2.9.2-ux.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify signed build
        env:
          SOURCE: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1288-820e-99a9-8bb8aeb656fb/raw?se=2026-11-01T02%3A56%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=9b724db4-5d55-5dc8-b2d3-c2c228a87edd&skoid=0a91ee30-885e-46c5-aa98-ae8c7359b1d8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T10%3A58%3A50Z&ske=2026-11-01T10%3A58%3A50Z&sks=b&skv=2026-02-06&sig=OrMkR1efJ%2BnD5J0RXNMA7NjFXsfbvPZdiBeQ5ouX/HQ%3D'
        run: |
          curl -fsSL --retry 3 "$SOURCE" -o build.zip
          unzip -q build.zip app-release.apk
          echo 'fec9e5e80e791376f10642ad99215883627fd30b44789aff8abee2ebfb41673d  app-release.apk' | sha256sum -c -
          mv app-release.apk AD-Car-Aura-2.9.2-OfflineUX-TEST.apk
      - name: Keep stable update channel unchanged
        run: |
          cat > AD-Car-Aura-2.9.2-OfflineUX-TEST.md <<'EOF'
          # AD Car Aura 2.9.2 OFFLINE UX — TESTE
          VersionCode 20, APK signed, Android 8+.
          - Offline MBTiles raster zoom remains native level 13. Limits zoom to +2 beyond native; GPS initially follows at +1 to reduce blocky road labels.
          - Removes redundant Waze Live · iframe floating button. Waze Live is available under map options.
          - Adds compact HD ONLINE button for switching to online map when internet is available.
          - Masks MapTiler API key text input. Revoke any previously exposed API key in MapTiler Cloud.
          - Preserves BRouter, maps, GPS, media, OEM FM and Ponte support from 2.9.1.
          - This is NOT an upgraded 18-zoom offline map. Full sharpness needs new tiles or vector renderer.
          - NO changes to aura-latest.json stable OTA index.
          EOF
          git config user.name adcar-release-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AD-Car-Aura-2.9.2-OfflineUX-TEST.apk AD-Car-Aura-2.9.2-OfflineUX-TEST.md
          git diff --cached --quiet || (git commit -m 'Publish Aura 2.9.2 offline map UX TEST' && git push)
