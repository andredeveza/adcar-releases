name: Publish AD Car Aura 2.4.0 APK
on:
  push:
    paths:
      - '.github/workflows/publish-aura-2.4.0.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified compiled APK artifact
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3770-820e-b938-0f9fcb66da6d/raw?se=2026-10-30T17%3A05%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=65bb8a85-1749-585e-99d8-e0eb38be290d&skoid=0a91ee30-885e-46c5-aa98-ae8c7359b1d8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-30T11%3A12%3A35Z&ske=2026-10-31T11%3A12%3A35Z&sks=b&skv=2026-02-06&sig=CU6WV229/dC2jFKaMkmZnYSboh3GTPVZGqp15Xbpa64%3D'
        run: |
          curl -fLsS --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip app-debug.apk
          echo '694e770185e90bf2b4084492a42c29708cab52d0ca2af29bce8a1a9327e6de95  app-debug.apk' | sha256sum -c -
          mv app-debug.apk AD-Car-Aura-2.4.0.apk
      - name: Update latest manifest and push
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          file=pathlib.Path('AD-Car-Aura-2.4.0.apk')
          manifest={
            "versionCode":9,
            "versionName":"2.4.0",
            "packageName":"br.com.adcomintegrada.adcar.aura",
            "apk":file.name,
            "sha256":hashlib.sha256(file.read_bytes()).hexdigest(),
            "sizeBytes":file.stat().st_size,
            "date":"2026-10-30",
            "notes":"AD Car Aura 2.4.0: corrige sobreposição entre o cabeçalho do aplicativo e os botões do sistema na central Android 8.1. Respeita barras de navegação e adiciona Editor > Faixa livre acima do Aura, ajuste automático para centrais Android 8.1, controles de 0, 56, 80 e até 120 px, salvamento da configuração. Mantém mídia, GPS, mapas e OBD2 da 2.3.0."
          }
          pathlib.Path('aura-latest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'adcar-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AD-Car-Aura-2.4.0.apk aura-latest.json
          git diff --staged --quiet || (git commit -m 'Release AD Car Aura 2.4.0 for OEM head-unit safety' && git push)
